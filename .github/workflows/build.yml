      - name: Patch AWS-PRO-FINAL.apk & Reseller Admin APK
        env:
          SERVER_URL: ${{ github.event.inputs.server_url || 'https://hassinalhadi.pythonanywhere.com' }}
        run: |
          mkdir -p output_release
          python3 - << 'PY'
          import os, io, json, base64, struct, hashlib, zlib, shutil, zipfile, urllib.parse
          from PIL import Image, ImageDraw

          raw_url = os.environ.get("SERVER_URL", "https://hassinalhadi.pythonanywhere.com").strip()
          if not raw_url.startswith("http://") and not raw_url.startswith("https://"):
              raw_url = "https://" + raw_url

          parsed = urllib.parse.urlparse(raw_url)
          base_server_url = f"{parsed.scheme}://{parsed.netloc}"
          reseller_url = base_server_url + "/reseller"

          print("Base Server URL for AWS-PRO-FINAL.apk:", base_server_url)
          print("Reseller URL for Admin APK:", reseller_url)

          # Cleanly cropped circular 256x256 emblem (never distorted or oval)

          def build_circular_logos():
              base_img = Image.open(io.BytesIO(open("/tmp/default_circle_logo.jpg", "rb").read())).convert("RGBA")
              base_img = base_img.resize((256, 256), Image.LANCZOS)

              mask = Image.new("L", (256, 256), 0)
              draw = ImageDraw.Draw(mask)
              draw.ellipse((0, 0, 255, 255), fill=255)

              png_im = Image.new("RGBA", (256, 256), (0, 0, 0, 0))
              png_im.paste(base_img, (0, 0), mask)
              png_buf = io.BytesIO()
              png_im.save(png_buf, format="PNG", optimize=True)

              jpg_im = Image.new("RGB", (256, 256), (20, 18, 24))
              jpg_im.paste(base_img.convert("RGB"), (0, 0), mask)
              jpg_buf = io.BytesIO()
              jpg_im.save(jpg_buf, format="JPEG", quality=92, optimize=True)
              return png_buf.getvalue(), jpg_buf.getvalue()


          def build_external_launcher_icon():
              ext_img = None
              for candidate in ("icon.png", "launcher_icon.png"):
                  if os.path.exists(candidate):
                      try:
                          ext_img = Image.open(candidate).convert("RGBA")
                          print(f"Loaded external launcher icon from {candidate}")
                          break
                      except Exception as e:
                          print(f"Warning reading {candidate}: {e}")
              if ext_img is None:
                  ext_img = Image.open(io.BytesIO(open("/tmp/default_external_icon.png", "rb").read())).convert("RGBA")
              ext_img = ext_img.resize((256, 256), Image.LANCZOS)
              buf = io.BytesIO()
              ext_img.save(buf, format="PNG", optimize=True)
              return buf.getvalue()

          logo_png_bytes, logo_jpg_bytes = build_circular_logos()
          external_icon_png_bytes = build_external_launcher_icon()

          def patch_resources_arsc(arsc_bytes: bytes) -> bytes:
              ba = bytearray(arsc_bytes)

              # 1. Write "Driver Assestant" (16 chars) into unused GlobalStr[397] slot at 0x45af
              app_name_str = b"\x10\x10Driver Assestant\x00"
              ba[0x45af:0x45af + len(app_name_str)] = app_name_str

              # Point all 4 locale Res_value entries for key='app_name' to GlobalStr[397]
              for off in (0x1d394, 0x1fc44, 0x224f4, 0x24da4):
                  struct.pack_into("<HBBI", ba, off, 8, 0, 3, 397)

              # 2. Overwrite GlobalStr[963] ('AWS PRO' at 0xc4dc) -> 'PK' (top-right header screen_title)
              pk_str = b"\x02\x02PK\x00\x00\x00\x00\x00\x00"
              ba[0xc4dc:0xc4dc + len(pk_str)] = pk_str

              # 3. Overwrite GlobalStr[964] ('AWS PRO Active' at 0xc4e6) -> 'PK Active'
              pk_act = b"\x09\x09PK Active\x00\x00\x00\x00\x00\x00"
              ba[0xc4e6:0xc4e6 + len(pk_act)] = pk_act

              # 4. Overwrite GlobalStr[965] ('AWS PRO Fleet Portal' at 0xc4f7) -> 'RIDER SOLOUTIO Pk'
              portal_str = b"\x11\x11RIDER SOLOUTIO Pk\x00\x00\x00\x00"
              ba[0xc4f7:0xc4f7 + len(portal_str)] = portal_str

              print("Patched resources.arsc: app_name='Driver Assestant', header='PK', title='RIDER SOLOUTIO Pk'.")
              return bytes(ba)

          def patch_libandroid_realtime(so_bytes: bytes, server_base_url: str) -> bytes:
              ba = bytearray(so_bytes)
              url_bytes = server_base_url.rstrip("/").encode("utf-8") + b"\x00"
              if len(url_bytes) > 320:
                  raise ValueError("Server URL too long (max 320 bytes)")

              ret_insn = struct.pack("<I", 0xd65f03c0) # RET
              mov1_ret = struct.pack("<II", 0x52800020, 0xd65f03c0) # MOV W0, #1; RET

              ba[0x14e0:0x14e4] = ret_insn  # initRealtimeGuard
              ba[0x1538:0x153c] = ret_insn  # check_tracer_pid
              ba[0x15f0:0x15f4] = ret_insn  # check_memory_maps
              ba[0x16f4:0x16fc] = mov1_ret  # verify_apk_certificate -> return 1
              ba[0x1c14:0x1c1c] = mov1_ret  # verify_classes_dex_integrity -> return 1
              ba[0x2050:0x2054] = ret_insn  # check_server_tampering
              ba[0x2648:0x264c] = ret_insn  # onServerUrlTampered
              ba[0x2664:0x2668] = ret_insn  # on_realtime_init (DT_INIT_ARRAY)

              ba[0x2060:0x2060 + len(url_bytes)] = url_bytes

              body_patch = struct.pack(
                  "<15I",
                  0x90000001, # adrp x1, 0x3000
                  0x91018021, # add  x1, x1, #0x60
                  0xf9400269, # ldr  x9, [x19, #0]
                  0xaa1303e0, # mov  x0, x19
                  0xf9429d29, # ldr  x9, [x9, #0x538] (NewStringUTF)
                  0xd503201f, 0xd503201f, 0xd503201f, 0xd503201f, 0xd503201f,
                  0xd503201f, 0xd503201f, 0xd503201f, 0xd503201f,
                  0xd63f0120, # blr  x9
              )
              ba[0x25fc:0x25fc + len(body_patch)] = body_patch
              return bytes(ba)

          def replace_dex_string_exact(ba: bytearray, old_s: str, new_s: str):
              assert len(old_s.encode("utf-8")) == len(new_s.encode("utf-8"))
              old_raw = bytes([len(old_s)]) + old_s.encode("utf-8") + b"\x00"
              new_raw = bytes([len(new_s)]) + new_s.encode("utf-8") + b"\x00"
              pos = ba.find(old_raw)
              if pos == -1:
                  raise RuntimeError(f"Could not find DEX string: {old_s!r}")
              ba[pos:pos + len(new_raw)] = new_raw

          def patch_classes_dex(dex_bytes: bytes) -> bytes:
              ba = bytearray(dex_bytes)

              # 1. Neutralize SanedAutoAcceptHelper.verifyNativeLibraryIntegrity
              verify_sig = bytes.fromhex("1a0056011a0144046e20142401000a00380003000e00")
              vpos = ba.find(verify_sig)
              if vpos != -1:
                  verify_patch = bytes.fromhex("1a0056011a0156016e20142401000a00380003000e00")
                  ba[vpos:vpos + len(verify_patch)] = verify_patch
                  print("Patched verifyNativeLibraryIntegrity in classes.dex.")

              # 2. Patch SanedAutoAcceptHelper.getTelemetryServerUrl
              tele_sig = bytes.fromhex("7100851200000c00380024001a019737")
              tpos = ba.find(tele_sig)
              if tpos != -1:
                  tele_patch = bytes.fromhex("7100851200000c007110d61200000c00") + (b"\x00\x00" * 30)
                  ba[tpos:tpos + len(tele_patch)] = tele_patch
                  print("Patched getTelemetryServerUrl in classes.dex.")

              # 3. Update WhatsApp message, WhatsApp number (+966547425565), WhatsApp Channel, and Telegram (@pkroot)
              replace_dex_string_exact(
                  ba,
                  "79fd596cb47e5bc61a0465b4bcebe26b68511123825f624fa7b20e5d654e3365",
                  "79fd596cb47https://whatsapp.com/channel/0029VbBG5dU77qVQNnSBIq2E"
              )
              replace_dex_string_exact(
                  ba,
                  "Hello AWS PRO Support, I want to activate AWS PRO.\nMy Device ID: ",
                  "Hello RIDER SOLOUTION PK team i want to activate DRIVER ASSISTANT"
              )
              replace_dex_string_exact(
                  ba,
                  "Hello AWS PRO Support, My Device ID: ",
                  "Hello RIDER SOLOUTION Z, My Device ID"
              )
              replace_dex_string_exact(
                  ba,
                  "\nDelegate Node: ",
                  "\nMy Device ID : "
              )
              replace_dex_string_exact(ba, "966576818921", "966547425565")
              replace_dex_string_exact(ba, "https://wa.me/966576818921?text=", "https://wa.me/966547425565?text=")
              replace_dex_string_exact(ba, "WhatsApp 1 (+966 57 681 8921)", "WhatsApp 1 (+966 54 742 5565)")
              replace_dex_string_exact(ba, "WhatsApp 2 (+973 3565 3381)", "WhatsApp 2 (Join Community)")
              replace_dex_string_exact(ba, "@aws_pro_max", "@pkroot     ")
              replace_dex_string_exact(ba, "https://t.me/aws_pro_max", "https://t.me/pkroot?s=01")

              # Patch openWhatsAppSupport (0x235a3e..0x235a6c) to concatenate [0x09f1] + [0x002b] ("\nMy Device ID : ") + deviceId
              msg_concat_patch = bytes.fromhex(
                  "1a02f109"          # const-string v2, [0x09f1] "Hello RIDER SOLOUTION PK team i want to activate DRIVER ASSISTANT"
                  "1a032b00"          # const-string v3, [0x002b] "\nMy Device ID : "
                  "6e20fa233200"      # invoke-virtual {v2, v3}, String->concat(String)String
                  "0c02"              # move-result-object v2
                  "6e20fa231200"      # invoke-virtual {v2, v1}, String->concat(String)String
                  "0c01"              # move-result-object v1
                  "7120d3240100"      # invoke-static {v1, v0}, URLEncoder->encode(String, String)String
                  "0c01"              # move-result-object v1
              ) + (b"\x00\x00" * 7)
              assert len(msg_concat_patch) == 0x235a6c - 0x235a3e
              ba[0x235a3e:0x235a6c] = msg_concat_patch

              # Replace str[0x081e] at 0x9c65b ("Drawable resource ID must not be 0") with "Driver Assestant"
              # (Preserves strict DEX string_ids alphabetical sort order between 0x081d "DrawResult..." and 0x081f "DropDownMenu"!)
              old_s81e = b"\x22Drawable resource ID must not be 0\x00"
              new_s81e = b"\x16Driver Assestant" + (b"\xe2\x80\x8b" * 6) + b"\x00"
              assert len(new_s81e) == len(old_s81e)
              assert ba[0x9c65b:0x9c65b + len(old_s81e)] == old_s81e
              ba[0x9c65b:0x9c65b + len(new_s81e)] = new_s81e
              ba[0x237b86:0x237b8a] = bytes.fromhex("1a0e1e08")
              ba[0x238d6a:0x238d6e] = bytes.fromhex("1a061e08")

              # Increase license token EditText max length from 16 (0x10) to 64 (0x40) so Riders-Soloution-pk-1 fits completely
              assert ba[0x238582:0x238586] == bytes.fromhex("13081000")
              ba[0x238582:0x238586] = bytes.fromhex("13084000")
              replace_dex_string_exact(ba, "e.g. 7K9X2P4M", "e.g. Riders-1")

              # Show 966547425565 on the WhatsApp Support button in VerificationActivity
              ba[0x238098:0x23809c] = bytes.fromhex("1a084504")
              # Point second WhatsApp option to the WhatsApp Channel string [0x0444]
              ba[0x235a92:0x235a96] = bytes.fromhex("1a044404")

              # Update SanedAutoAcceptHelper$3.onClick to open wa.me/966547425565 for item 0 and WhatsApp Channel for item 1
              new_onclick_body = bytes.fromhex(
                  "5423d008"
                  "46030304"
                  "39041800"
                  "5424cf08"
                  "2200e807"
                  "701024240000"
                  "1a01af31"
                  "6e2031241000"
                  "0c00"
                  "6e2031244000"
                  "0c00"
                  "6e103a240000"
                  "0c03"
                  "2808"
                  "13000b00"
                  "6e2017240300"
                  "0c03"
                  "0000"
              )
              ba[0x2343bc:0x234402] = new_onclick_body

              # 4. Make logo frame a 100% pure circle (48.dp radius on 96.dp box) in MainActivity (Luw1->x at 0x3c626c)
              assert ba[0x3c626c:0x3c6270] == bytes.fromhex("1504c041")
              ba[0x3c626c:0x3c6270] = bytes.fromhex("15044042")

              # Enable circular bitmap cropping in VerificationActivity.createCircularLogo (0x23794c -> old_getCroppedBitmap)
              assert ba[0x23794c:0x237952] == bytes.fromhex("702009131400")
              ba[0x23794c:0x237952] = bytes.fromhex("70201c131400")

              print("Patched classes.dex: WhatsApp message, circular logo framing, and support links.")

              # 5. Recompute DEX SHA-1 signature and Adler32 checksum
              sha1 = hashlib.sha1(ba[32:]).digest()
              ba[12:32] = sha1
              chk = zlib.adler32(ba[12:]) & 0xffffffff
              struct.pack_into("<I", ba, 8, chk)
              return bytes(ba)

          apks = []
          for root, _, files in os.walk("."):
              if "output_release" in root or ".git" in root:
                  continue
              for file in files:
                  if file.lower().endswith(".apk"):
                      apks.append(os.path.join(root, file))

          if not apks:
              raise FileNotFoundError("No APK files found in repository!")

          for orig_apk in apks:
              with zipfile.ZipFile(orig_apk, "r") as zin:
                  names = set(zin.namelist())
                  is_final_client = "lib/arm64-v8a/libandroid_realtime.so" in names
                  is_reseller_admin = "assets/app_config.json" in names

                  if is_final_client:
                      out_unsigned = "output_release/unsigned_AWS-PRO-FINAL.apk"
                      print(f"Patching Client APK ({orig_apk}) -> {out_unsigned}")
                      with zipfile.ZipFile(out_unsigned, "w") as zout:
                          for item in zin.infolist():
                              fn = item.filename
                              if fn.startswith("META-INF/"):
                                  u = fn.upper()
                                  if u == "META-INF/MANIFEST.MF" or u.endswith(".SF") or u.endswith(".RSA") or u.endswith(".DSA"):
                                      continue
                              if fn in ("assets/dexopt/baseline.prof", "assets/dexopt/baseline.profm"):
                                  continue
                              raw = zin.read(fn)
                              if fn == "lib/arm64-v8a/libandroid_realtime.so":
                                  raw = patch_libandroid_realtime(raw, base_server_url)
                              elif fn == "classes.dex":
                                  raw = patch_classes_dex(raw)
                              elif fn == "resources.arsc":
                                  raw = patch_resources_arsc(raw)
                              elif fn == "res/drawable/dahwal_logo.png":
                                  # External desktop/launcher icon ONLY (AndroidManifest android:icon & android:roundIcon)
                                  raw = external_icon_png_bytes
                              elif fn == "assets/dahwal_logo.png":
                                  # Internal Activation screen logo
                                  raw = logo_png_bytes
                              elif fn == "res/drawable/vendor.jpg":
                                  # Internal Main screen logo
                                  raw = logo_jpg_bytes
                              info = zipfile.ZipInfo(filename=item.filename, date_time=item.date_time)
                              info.compress_type = item.compress_type
                              info.external_attr = item.external_attr
                              zout.writestr(info, raw, compress_type=item.compress_type)

                  elif is_reseller_admin:
                      out_unsigned = "output_release/unsigned_AWS_PRO_R_Admin.apk"
                      print(f"Patching Reseller Admin APK ({orig_apk}) -> {out_unsigned}")
                      with zipfile.ZipFile(out_unsigned, "w") as zout:
                          for item in zin.infolist():
                              fn = item.filename
                              if fn.startswith("META-INF/"):
                                  u = fn.upper()
                                  if u == "META-INF/MANIFEST.MF" or u.endswith(".SF") or u.endswith(".RSA") or u.endswith(".DSA"):
                                      continue
                              raw = zin.read(fn)
                              if fn == "assets/app_config.json":
                                  cfg = json.loads(raw.decode("utf-8"))
                                  cfg["appType"] = "WEB"
                                  cfg["targetUrl"] = reseller_url
                                  cfg["activationEnabled"] = False
                                  if parsed.netloc and parsed.netloc not in cfg.get("deepLinkHosts", []):
                                      cfg.setdefault("deepLinkHosts", []).insert(0, parsed.netloc)
                                  raw = json.dumps(cfg, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
                              info = zipfile.ZipInfo(filename=item.filename, date_time=item.date_time)
                              info.compress_type = item.compress_type
                              info.external_attr = item.external_attr
                              zout.writestr(info, raw, compress_type=item.compress_type)
          PY

      - name: Align & Sign All Patched APKs
        run: |
          keytool -genkeypair -v -keystore /tmp/release.jks \
            -alias aws_pro_key -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=AWS PRO, OU=IT, O=Saned, L=Samawah, C=IQ"

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -d "$SDK_ROOT/build-tools" ]; then
            BUILD_TOOLS=$(ls -d "$SDK_ROOT/build-tools/"* | sort -V | tail -n 1)
            ZIPALIGN="$BUILD_TOOLS/zipalign"
            APKSIGNER="$BUILD_TOOLS/apksigner"
          else
            sudo apt-get update && sudo apt-get install -y zipalign apksigner
            ZIPALIGN="zipalign"
            APKSIGNER="apksigner"
          fi

          for unsigned_file in output_release/unsigned_*.apk; do
            [ -e "$unsigned_file" ] || continue
            base_name=$(basename "$unsigned_file" | sed 's/^unsigned_//')
            aligned_file="output_release/aligned_${base_name}"
            signed_file="output_release/Patched_${base_name}"
            "$ZIPALIGN" -p -f -v 4 "$unsigned_file" "$aligned_file"
            "$APKSIGNER" sign --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --ks /tmp/release.jks --ks-pass pass:android123 --key-pass pass:android123 \
              --out "$signed_file" "$aligned_file"
            "$APKSIGNER" verify --verbose "$signed_file"
            rm -f "$unsigned_file" "$aligned_file" "${signed_file}.idsig"
            echo "✅ Ready: $signed_file"
          done

      - name: Package Python Server
        run: |
          if [ -d "license-server-python" ]; then
            cd license-server-python
            zip -r ../output_release/saned-python-license-server.zip .
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AWS_PRO_Patched_Release
          path: output_release/
