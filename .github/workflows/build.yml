name: Build & Patch AWS-PRO-FINAL.apk + Reseller Admin APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      server_url:
        description: 'رابط السيرفر الأساسي (مثال: https://hassinalhadi.pythonanywhere.com)'
        required: true
        default: 'https://hassinalhadi.pythonanywhere.com'

jobs:
  build-and-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.11 & Pillow
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

