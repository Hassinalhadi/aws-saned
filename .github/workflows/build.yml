name: Build & Patch AWS PRO R_Admin APK (Embedded Server + Custom URL)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'اكتب EMBEDDED لتشغيل لوحة الموزعين المدمجة داخل التطبيق بدون أخطاء 404، أو ضع رابط سيرفرك الخارجي الفعلي'
        required: true
        default: 'EMBEDDED'
      app_name:
        description: 'اسم التطبيق (App Name)'
        required: false
        default: 'AWS PRO 🕸️R_Admin'
      activation_enabled:
        description: 'طلب كود تفعيل عند فتح التطبيق؟ (false = يفتح مباشرة بدون كود، true = يطلب كود)'
        required: false
        default: 'false'

jobs:
  build-and-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch APK (Embed Internal Reseller Server & Configure URL)
        env:
          TARGET_URL: ${{ github.event.inputs.target_url || 'EMBEDDED' }}
          APP_NAME: ${{ github.event.inputs.app_name || 'AWS PRO 🕸️R_Admin' }}
          ACTIVATION_ENABLED: ${{ github.event.inputs.activation_enabled || 'false' }}
        run: |
          mkdir -p output_release
          python3 - << 'PY'
          import os, json, gzip, base64, shutil, zipfile, urllib.parse

          EMBEDDED_HTML_GZ_B64 = ""
          embedded_html_bytes = gzip.decompress(base64.b64decode(EMBEDDED_HTML_GZ_B64))

          raw_target = os.environ.get("TARGET_URL", "EMBEDDED").strip()
          app_name = os.environ.get("APP_NAME", "AWS PRO 🕸️R_Admin").strip()
          act_enabled = os.environ.get("ACTIVATION_ENABLED", "false").strip().lower() == "true"

          use_embedded = (not raw_target) or (raw_target.upper() == "EMBEDDED")
          if not use_embedded and not raw_target.startswith("http://") and not raw_target.startswith("https://"):
              raw_target = "https://" + raw_target

          apks = []
          for root, _, files in os.walk("."):
              if "output_release" in root or ".git" in root:
                  continue
              for file in files:
                  if file.lower().endswith(".apk"):
                      apks.append(os.path.join(root, file))

          if not apks:
              raise FileNotFoundError("No APK file found in repository to patch!")

          orig_apk = apks[0]
          print("Found original APK:", orig_apk)

          unsigned_apk = "output_release/unsigned_patched.apk"
          if os.path.exists(unsigned_apk):
              os.remove(unsigned_apk)

          with zipfile.ZipFile(orig_apk, "r") as zin, zipfile.ZipFile(unsigned_apk, "w") as zout:
              has_html_index = False
              for item in zin.infolist():
                  fn = item.filename
                  if fn.startswith("META-INF/"):
                      upper_fn = fn.upper()
                      if upper_fn == "META-INF/MANIFEST.MF" or upper_fn.endswith(".SF") or upper_fn.endswith(".RSA") or upper_fn.endswith(".DSA"):
                          continue
                  if fn == "assets/html/index.html":
                      has_html_index = True

                  raw_bytes = zin.read(fn)
                  if fn == "assets/app_config.json":
                      cfg = json.loads(raw_bytes.decode("utf-8"))
                      cfg["appName"] = app_name
                      cfg["activationEnabled"] = act_enabled

                      wv = cfg.setdefault("webViewConfig", {})
                      wv["enableNativeBridge"] = True
                      wv["enablePrivateNetworkBridge"] = True
                      wv["privateNetworkScope"] = "CORS_BYPASS"

                      if use_embedded:
                          cfg["appType"] = "HTML"
                          cfg["siteAssetBase"] = "html"
                          cfg["htmlUsesFileScheme"] = False
                          cfg["targetUrl"] = "http://127.0.0.1/index.html"
                          html_cfg = cfg.setdefault("htmlConfig", {})
                          html_cfg["entryFile"] = "index.html"
                          html_cfg["enableJavaScript"] = True
                          html_cfg["enableLocalStorage"] = True
                          html_cfg["loadMode"] = "AUTO"
                          print("Configured APK in EMBEDDED LocalHttpServer mode (assets/html/index.html) - zero 404 errors!")
                      else:
                          cfg["appType"] = "WEB"
                          cfg["targetUrl"] = raw_target
                          parsed = urllib.parse.urlparse(raw_target)
                          if parsed.netloc and parsed.netloc not in cfg.get("deepLinkHosts", []):
                              cfg.setdefault("deepLinkHosts", []).insert(0, parsed.netloc)
                          print("Configured APK in external WEB mode ->", raw_target)

                      raw_bytes = json.dumps(cfg, ensure_ascii=False, separators=(",", ":")).encode("utf-8")

                  new_info = zipfile.ZipInfo(filename=item.filename, date_time=item.date_time)
                  new_info.compress_type = item.compress_type
                  new_info.external_attr = item.external_attr
                  zout.writestr(new_info, raw_bytes, compress_type=item.compress_type)

              if not has_html_index:
                  html_info = zipfile.ZipInfo(filename="assets/html/index.html", date_time=(2026, 11, 7, 12, 0, 0))
                  html_info.compress_type = zipfile.ZIP_DEFLATED
                  html_info.external_attr = 0o644 << 16
                  zout.writestr(html_info, embedded_html_bytes, compress_type=zipfile.ZIP_DEFLATED)
                  print("Embedded assets/html/index.html inside APK.")
          PY

      - name: Align & Sign Patched APK
        run: |
          if [ -f "output_release/unsigned_patched.apk" ]; then
            keytool -genkeypair -v -keystore /tmp/release.jks \
              -alias aws_pro_key -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android123 -keypass android123 \
              -dname "CN=AWS PRO Admin, OU=IT, O=Saned, L=Samawah, C=IQ"

            SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
            if [ -d "$SDK_ROOT/build-tools" ]; then
              BUILD_TOOLS=$(ls -d "$SDK_ROOT/build-tools/"* | sort -V | tail -n 1)
              ZIPALIGN="$BUILD_TOOLS/zipalign"
              APKSIGNER="$BUILD_TOOLS/apksigner"
            else
              sudo apt-get update && sudo apt-get install -y zipalign apksigner
              ZIPALIGN="zipalign"
              APKSIGNER="apksigner"
            fi

            "$ZIPALIGN" -f -v 4 output_release/unsigned_patched.apk output_release/aligned.apk
            "$APKSIGNER" sign --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --ks /tmp/release.jks --ks-pass pass:android123 --key-pass pass:android123 \
              --out output_release/AWS_PRO_R_Admin_Patched_Signed.apk output_release/aligned.apk
            "$APKSIGNER" verify --verbose output_release/AWS_PRO_R_Admin_Patched_Signed.apk
            rm -f output_release/unsigned_patched.apk output_release/aligned.apk
            echo "✅ Signed APK ready: output_release/AWS_PRO_R_Admin_Patched_Signed.apk"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AWS_PRO_R_Admin_Release
          path: output_release/
