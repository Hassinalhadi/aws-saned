services:
  - type: web
    name: saned-license-server
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: ADMIN_PASSWORD
        value: admin123
      - key: RESELLER_PASSWORD
        value: saned2026
      - key: MASTER_TOKEN
        value: AWS-PRO-MASTER-2026
